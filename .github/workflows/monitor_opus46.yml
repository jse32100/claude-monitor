name: Opus 4.6 Score Monitor

on:
  workflow_dispatch:

concurrency:
  group: opus46-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run monitor
        env:
          DISCORD_WEBHOOK_OPUS46: ${{ secrets.DISCORD_WEBHOOK_OPUS46 }}
        run: python monitor_opus46.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state_opus46.json
          git diff --staged --quiet || git commit -m "chore: update opus4.6 state"
          git pull --rebase
          git push
